<!doctype html>
<html lang="zh-CN">
<head>
    <!-- Meta Properties -->
    <meta charset="UTF-8">
    <title>1024 吞噬大战</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css" />
    <!-- Audio -->
    <audio id="split_cell" src="audio/split.mp3"></audio>
    <audio id="spawn_cell" src="audio/spawn.mp3"></audio>
</head>
<body>
    <div id="gameAreaWrapper">
        <div id="connectionStatus" role="status" aria-live="polite" hidden>连接已断开，正在重连…</div>
        <div id="status"><span class="title">排行榜</span></div>
        <div class="chatbox" id="chatbox">
            <ul id="chatList" class="chat-list"></ul>
            <input id="chatInput" type="text" class="chat-input" placeholder="输入聊天内容..." maxlength="35" />
        </div>
        <div id="mobile">
           <input type="image" id="split" class="split" src="img/split.png" alt="splitBtn">
           <input type="image" id="feed" class="feed" src="img/feed.png" alt="feedBtn">
        </div>
        <canvas tabindex="1" id="cvs"></canvas>
    </div>
    <div id="startMenuWrapper">
        <div id="startMenu">
            <p>1024 吞噬大战</p>
            <input type="text" tabindex="0" autofocus placeholder="输入昵称" id="playerNameInput" maxlength="25" />
            <b class="input-error">昵称只能使用中文、字母、数字和下划线</b>
            <br />
            <a onclick="document.getElementById('spawn_cell').play();"><button id="startButton">开始游戏</button></a>
            <button id="spectateButton">观战</button>
            <button id="settingsButton">设置</button>
            <br />
            <div id="settings">
                <h3>设置</h3>
                <ul>
                    <label><input id="visBord" type="checkbox">显示边界</label>
                    <label><input id="showMass" type="checkbox">显示体积</label>
                    <br />
                    <label><input id="continuity" type="checkbox">鼠标移出屏幕后继续移动</label>
                    <br />
                    <label><input id="roundFood" type="checkbox" checked>圆形食物</label>
                    <label><input id="darkMode" type="checkbox">深色模式</label>
                </ul>
            </div>
            <div id="instructions">
                <h3>玩法</h3>
                <ul>
                    <li>移动鼠标控制方向；手机上用触屏控制。</li>
                    <li>吃掉食物和比自己小的玩家来变大。</li>
                    <li>体积越大，移动越慢。</li>
                    <li>目标：活下来，冲上排行榜。</li>
                </ul>
            </div>
        </div>
    </div>
    <!-- JS -->
    <script src="js/app.js"></script>
</body>
</html>
